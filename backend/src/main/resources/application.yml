spring:
  application:
    name: clinica-leve-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://23.106.44.62:3308/clinica-leve?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:clinica-leve}
    password: ${SPRING_DATASOURCE_PASSWORD:AhbbyGpiDkPZRca6}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
    test-connection: false

server:
  port: 8080
  forward-headers-strategy: framework
  error:
    include-message: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: clinica-leve-api

security:
  jwt:
    secret: ${JWT_SECRET:desenvolvimento-chave-insegura-32-char}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  login:
    max-failures: ${LOGIN_MAX_FAILURES:5}
    window-minutes: ${LOGIN_WINDOW_MINUTES:15}
    lock-minutes: ${LOGIN_LOCK_MINUTES:15}

app:
  public-url: ${FRONTEND_PUBLIC_URL:http://localhost:5173}
  uploads:
    directory: ${APP_UPLOAD_DIRECTORY:./uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  seed:
    enabled: ${SEED_ENABLED:true}
    clinic-name: ${SEED_CLINIC_NAME:Clínica Demonstração}
    clinic-slug: ${SEED_CLINIC_SLUG:clinica-demo}
    admin-name: ${SEED_ADMIN_NAME:Administrador}
    admin-email: ${SEED_ADMIN_EMAIL:admin@clinicaleve.local}
    admin-password: ${SEED_ADMIN_PASSWORD:Admin@123}
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:false}
    clinic-name: ${BOOTSTRAP_CLINIC_NAME:}
    clinic-slug: ${BOOTSTRAP_CLINIC_SLUG:}
    admin-name: ${BOOTSTRAP_ADMIN_NAME:}
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  account-mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:}
    reply-to: ${MAIL_REPLY_TO:}
    reset-expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:30}
    invitation-expiration-hours: ${INVITATION_EXPIRATION_HOURS:48}
  asaas:
    enabled: ${ASAAS_ENABLED:false}
    environment: ${ASAAS_ENVIRONMENT:sandbox}
    api-key: ${ASAAS_API_KEY:}
    webhook-token: ${ASAAS_WEBHOOK_TOKEN:}
    frontend-url: ${FRONTEND_PUBLIC_URL:http://localhost:5173}
  signature:
    enabled: ${SIGNATURE_ENABLED:false}
    master-key: ${SIGNATURE_MASTER_KEY:}
    storage-directory: ${SIGNATURE_STORAGE_DIRECTORY:${APP_UPLOAD_DIRECTORY:./uploads}/signed-documents}
    verification-base-url: ${SIGNATURE_VERIFICATION_BASE_URL:${FRONTEND_PUBLIC_URL:http://localhost:5173}/verify}
    csc-providers-json: ${SIGNATURE_CSC_PROVIDERS_JSON:[]}
  messaging:
    enabled: ${MESSAGING_ENABLED:false}
    provider: ${MESSAGING_PROVIDER:META_WHATSAPP}
    graph-version: ${META_GRAPH_VERSION:v23.0}
    phone-number-id: ${META_PHONE_NUMBER_ID:}
    access-token: ${META_ACCESS_TOKEN:}
    app-secret: ${META_APP_SECRET:}
    webhook-verify-token: ${META_WEBHOOK_VERIFY_TOKEN:}
    queue-delay-ms: ${MESSAGING_QUEUE_DELAY_MS:60000}
