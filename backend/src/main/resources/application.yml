spring:
  application:
    name: clinica-leve-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://23.106.44.62:3308/clinica-leve?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:clinica-leve}
    password: ${SPRING_DATASOURCE_PASSWORD:AhbbyGpiDkPZRca6}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  forward-headers-strategy: framework
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

security:
  jwt:
    secret: ${JWT_SECRET:desenvolvimento-chave-insegura-32-char}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  seed:
    enabled: ${SEED_ENABLED:true}
    clinic-name: ${SEED_CLINIC_NAME:Clínica Demonstração}
    clinic-slug: ${SEED_CLINIC_SLUG:clinica-demo}
    admin-name: ${SEED_ADMIN_NAME:Administrador}
    admin-email: ${SEED_ADMIN_EMAIL:admin@clinicaleve.local}
    admin-password: ${SEED_ADMIN_PASSWORD:Admin@123}
